<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Dev Workshop Starter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>IEEE WIE Web Dev Workshop</h1>
    <p>Starter template focused on HTML and CSS.</p>
    <button
      id="welcomeButton"
      type="button"
      onclick="document.getElementById('message').textContent = 'Welcome to the workshop! Start editing this project.'"
    >
      Click Me
    </button>
  </header>

  <main class="content">
    <section>
      <h2>What you'll practice</h2>
      <ul>
        <li>Editing HTML structure</li>
        <li>Styling with CSS</li>
        <li>Adding behavior with simple inline JavaScript when needed</li>
      </ul>
    </section>

    <section>
      <h2>Live message</h2>
      <p id="message">Press the button to see a simple inline action.</p>
    </section>
  </main>

</body>
</html>
